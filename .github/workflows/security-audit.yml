name: Security Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # --omit=dev skips jsdom/glob vulnerabilities which are dev-only (never in production)
      - name: Run security audit
        run: npm audit --audit-level=critical --omit=dev